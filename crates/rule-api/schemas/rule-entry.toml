type_id = "rule-entry"

states = [
    "draft",
    "reviewed",
    "adopted",
    "deprecated",
]

[[transitions]]
from = "draft"
to = "reviewed"

[[transitions]]
from = "reviewed"
to = "draft"

[[transitions]]
from = "reviewed"
to = "adopted"

[[transitions]]
from = "adopted"
to = "reviewed"

[[transitions]]
from = "adopted"
to = "deprecated"

[[transitions]]
from = "deprecated"
to = "reviewed"

[fields.slug]
field_type = "string"
required = true

[fields.title]
field_type = "string"
required = true

[fields.type]
field_type = "string"
required = true

[fields.state]
field_type = "string"
required = true

[fields.file_kind]
field_type = "string"
required = true

[fields.section]
field_type = "string"
required = true

[fields.body]
field_type = "string"
required = false

[fields.order_key]
field_type = "integer"
required = false

[fields.repo_scopes]
field_type = "json"
required = false

[fields.path_scopes]
field_type = "json"
required = false

[fields.sentence_anchors]
field_type = "json"
required = false

[fields.source_repo]
field_type = "string"
required = false

[fields.source_path]
field_type = "string"
required = false

[fields.source_start_line]
field_type = "integer"
required = false

[fields.source_end_line]
field_type = "integer"
required = false

[fields.feedback_helpful_count]
field_type = "integer"
required = false

[fields.feedback_mixed_count]
field_type = "integer"
required = false

[fields.feedback_not_helpful_count]
field_type = "integer"
required = false

[fields.feedback_note_count]
field_type = "integer"
required = false

[fields.feedback_unresolved_count]
field_type = "integer"
required = false

[fields.feedback_last_at]
field_type = "date_time"
required = false