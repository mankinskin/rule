[package]
name = "rule-api"
version = "0.1.0"
edition = "2024"
description = "Rule system: canonical instruction/rule manifest model, storage, and schema"

[dependencies]
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main"  }
feedback-api = { git = "https://github.com/mankinskin/memory-api", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"